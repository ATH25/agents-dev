find_trending_companies:
  description: >
    Find exactly 3 distinct publicly traded companies currently trending within
    {sector_name} as of {current_date}. Use recent company news, earnings
    announcements and guidance, press releases, SEC filings or material
    filing-related news, analyst upgrades/downgrades or estimate changes,
    product/customer/partnership/strategic announcements, verifiable insider
    transactions, significant stock-price or volume movement and its cause, and
    sector-specific developments as signals. Do not return the same company
    under different names or ticker representations. The output must be valid
    JSON.
  expected_output: >
    A structured list of exactly 3 unique companies. For every company provide:
    company name, ticker symbol, why it is currently trending, key recent
    catalysts, and important source references or URLs when available.
  agent: trending_company_finder
  output_file: output/trending_companies.json

research_trending_companies:
  description: >
    Research all 3 companies identified by find_trending_companies. Do not
    fabricate financial figures; if reliable data cannot be found, explicitly
    state that instead of guessing. Distinguish factual findings from
    analytical conclusions. For each company investigate, where reliable
    information is available: company name and ticker, business model and
    major revenue drivers, competitive position, recent revenue and earnings
    performance, revenue and earnings growth trends, profitability and
    margins, cash flow and balance-sheet strength, debt and liquidity, recent
    earnings results and management guidance, valuation considerations,
    important recent news and catalysts, material risks and negative
    developments, analyst sentiment when useful and current, bull case, bear
    case, and overall investment thesis. The output must be valid JSON.
  expected_output: >
    A structured report containing research for exactly the 3 companies from
    find_trending_companies, covering every item listed above, with source
    references for significant current claims when available.
  agent: financial_researcher
  output_file: output/research_report.json

pick_best_company:
  description: >
    Compare the completed research for all 3 candidate companies and select
    exactly one as the strongest investment candidate. Base the decision on
    financial health, growth trajectory, earnings quality, competitive
    position, valuation, near- and medium-term catalysts, downside risks,
    strength of available evidence, and overall risk/reward relative to the
    other candidates — not simply the company with the strongest recent price
    movement. After determining the winner, call the send_push_notification
    tool with a 1-3 sentence message that includes the company name, ticker
    symbol, and primary reason for selection.
  expected_output: >
    The selected company, its ticker, a concise investment thesis, the primary
    reasons for selection, important catalysts, key risks, and why the company
    ranks above the alternatives.
  agent: stock_picker
  output_file: output/decision.md
