propose_task:
  description: >
    Generate a compelling argument in favor of the {motion}.
  expected_output: >
    A persuasive markdown document supporting the motion.
  agent: debater

oppose_task:
  description: >
    Generate a compelling argument against the {motion}.
  expected_output: >
    A persuasive markdown document opposing the motion.
  agent: debater

decide_task:
  description: >
    Evaluate the arguments from the proponent and opponent for the {motion} and declare a winner.
  expected_output: >
    A reasoned judgment in markdown format including the winner and justification.
  agent: judge
